<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiki eSIM — all content</title>
<meta name="description" content="Every file and image: 4,605 numbered items — Emirates illustrations, wallpapers, boarding passes, city assets, widgets, animations, specs and transcripts.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂</text></svg>">
<style>
  :root{--bg:#0e0f11;--card:#17191d;--line:#2a2d33;--ink:#e9ecf1;--dim:#8a919c;--accent:#7dd3a0;--badge:#0e0f11}
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--card:#fff;--line:#e2e5ea;--ink:#16181c;--dim:#6b7280;--accent:#0f8a52;--badge:#fff}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:10;background:var(--bg);
         border-bottom:1px solid var(--line);padding:14px 18px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1500px;margin:0 auto}
  h1{margin:0;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
  .count{color:var(--dim);font-size:12px;white-space:nowrap}
  input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);
               border-radius:9px;padding:8px 11px;font-size:14px;font-family:inherit}
  input{flex:1;min-width:150px}
  main{max-width:1500px;margin:0 auto;padding:16px 18px 60px}
  h2{font-size:14px;margin:26px 0 10px;color:var(--dim);font-weight:600;
     position:sticky;top:58px;background:var(--bg);padding:6px 0;z-index:5}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  figure{position:relative;margin:0;background:var(--card);border:1px solid var(--line);
         border-radius:11px;overflow:hidden;scroll-margin-top:110px}
  figure.hit{outline:2px solid var(--accent);outline-offset:1px}
  figure img,figure video{width:100%;height:150px;object-fit:cover;display:block;background:#000}
  .num{position:absolute;top:6px;left:6px;z-index:2;min-width:28px;height:22px;padding:0 6px;
       border-radius:7px;background:var(--accent);color:var(--badge);
       font:700 12px/22px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}
  figcaption{padding:7px 9px;font-size:11px;color:var(--dim);word-break:break-all;
             border-top:1px solid var(--line)}
  .doc{display:flex;align-items:center;justify-content:center;height:150px;
       font:600 12px ui-monospace,Menlo,monospace;color:var(--accent);text-align:center;padding:10px}
  .note{margin:0 auto 6px;max-width:1500px;color:var(--dim);font-size:12.5px}
  #more{display:block;margin:26px auto;padding:11px 20px;background:var(--card);
        color:var(--ink);border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer}
  #empty{color:var(--dim);padding:30px 0}
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>Kiki eSIM — all content</h1>
    <span class="count" id="count">loading…</span>
    <input id="q" placeholder="number (412), name (wallpaper), or D0412" autocomplete="off">
    <select id="grp"><option value="">All groups</option></select>
    <select id="kind"><option value="">All kinds</option></select>
  </div>
</header>

<main>
  <p class="note">
    Every file and image, numbered <strong>D0001–D4605</strong>. Say a number out loud to point at one.
    The 78 curated app screens are separate, at <a href="./">the screen review page</a> (S001–S078).
    Machine-readable: <a href="catalog/all.tsv">all.tsv</a> · <a href="ALL-CONTENT.md">ALL-CONTENT.md</a>
  </p>
  <div id="out"></div>
  <p id="empty" hidden>Nothing matches that.</p>
  <button id="more" hidden>Show more</button>
</main>

<script>
const PAGE = 300;
let DATA = null, view = [], shown = 0;

const el = (id) => document.getElementById(id);
const IMG = new Set(['image']), VID = new Set(['video']);

fetch('catalog/all.json').then(r => r.json()).then(d => {
  DATA = d;
  d.groups.forEach((g, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = g;
    el('grp').appendChild(o);
  });
  d.kinds.forEach((k, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = k;
    el('kind').appendChild(o);
  });
  apply();
  if (location.hash) jump(location.hash);
}).catch(e => { el('count').textContent = 'failed to load catalog'; });

function apply() {
  const q = el('q').value.trim().toLowerCase().replace(/^d0*/, '');
  const g = el('grp').value, k = el('kind').value;
  const n = q && /^\d+$/.test(q) ? parseInt(q, 10) : null;

  view = DATA.items.filter(it => {
    if (g !== '' && it[2] != g) return false;
    if (k !== '' && it[1] != k) return false;
    if (!q) return true;
    if (n !== null && it[0] === n) return true;
    return it[4].toLowerCase().includes(q) || it[3].toLowerCase().includes(q);
  });

  el('count').textContent = view.length.toLocaleString() + ' of ' +
    DATA.items.length.toLocaleString() + ' files';
  el('out').innerHTML = '';
  shown = 0;
  el('empty').hidden = view.length > 0;
  render();
}

function render() {
  const slice = view.slice(shown, shown + PAGE);
  let curGroup = shown > 0 ? lastGroup : null, grid = null;
  const frag = document.createDocumentFragment();

  slice.forEach(it => {
    const gname = DATA.groups[it[2]];
    if (gname !== curGroup) {
      const h = document.createElement('h2');
      h.textContent = gname;
      frag.appendChild(h);
      grid = document.createElement('div');
      grid.className = 'grid';
      frag.appendChild(grid);
      curGroup = gname;
    }
    if (!grid) {
      grid = document.createElement('div');
      grid.className = 'grid';
      frag.appendChild(grid);
    }
    grid.appendChild(cardFor(it));
  });

  lastGroup = curGroup;
  el('out').appendChild(frag);
  shown += slice.length;
  el('more').hidden = shown >= view.length;
  el('more').textContent = 'Show more (' + (view.length - shown).toLocaleString() + ' left)';
}
let lastGroup = null;

function cardFor(it) {
  const [n, ki, gi, path, name, size] = it;
  const kind = DATA.kinds[ki];
  const url = DATA.base + path;

  const fig = document.createElement('figure');
  fig.id = 'D' + String(n).padStart(4, '0');

  const badge = document.createElement('span');
  badge.className = 'num';
  badge.textContent = n;
  fig.appendChild(badge);

  if (IMG.has(kind)) {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank';
    const img = document.createElement('img');
    img.loading = 'lazy'; img.src = url; img.alt = 'D' + n + ' ' + name;
    a.appendChild(img);
    fig.appendChild(a);
  } else if (VID.has(kind)) {
    const v = document.createElement('video');
    v.controls = true; v.preload = 'metadata'; v.src = url;
    fig.appendChild(v);
  } else {
    const a = document.createElement('a');
    a.className = 'doc'; a.href = url; a.target = '_blank';
    a.textContent = kind.toUpperCase() + ' — open';
    fig.appendChild(a);
  }

  const cap = document.createElement('figcaption');
  cap.textContent = name + ' · ' + size;
  fig.appendChild(cap);
  return fig;
}

function jump(hash) {
  const id = hash.replace('#', '').toUpperCase();
  const n = parseInt(id.replace(/^D0*/, ''), 10);
  if (!n) return;
  el('q').value = 'D' + String(n).padStart(4, '0');
  apply();
  const t = document.getElementById('D' + String(n).padStart(4, '0'));
  if (t) { t.classList.add('hit'); t.scrollIntoView({ block: 'center' }); }
}

el('q').addEventListener('input', apply);
el('grp').addEventListener('change', apply);
el('kind').addEventListener('change', apply);
el('more').addEventListener('click', render);
window.addEventListener('hashchange', () => jump(location.hash));
</script>
</body>
</html>
